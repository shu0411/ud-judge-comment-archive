name: ツイート追加
description: 審査員コメントのツイートを tweetList.json に追加します
title: "ツイート追加: "
labels: ["add-tweets"]
body:
  - type: dropdown
    id: operation
    attributes:
      label: 操作
      options:
        - 既存の大会に追加
        - 新しい大会を作成して追加
    validations:
      required: true

  - type: input
    id: tournament-year
    attributes:
      label: 年度
      description: >-
        Summer・Freshは `2026`、Winterは `2026-27` の形式で入力してください。
        「既存の大会に追加」で年度・大会種類の両方を未指定にすると最新大会になります。「新しい大会を作成して追加」では必須です。
      placeholder: "2026"

  - type: dropdown
    id: tournament-season
    attributes:
      label: 大会種類
      options:
        - Summer
        - Winter
        - Fresh

  - type: dropdown
    id: event
    attributes:
      label: 日程
      options:
        - 決勝戦
        - 敗者復活戦
        - 関東
        - 東海
        - 関西
        - 九州
        - 北海道
    validations:
      required: true

  - type: dropdown
    id: day
    attributes:
      label: 日目
      description: 決勝戦・敗者復活戦を選んだ場合は「なし」のままにしてください。
      options:
        - なし
        - "1"
        - "2"
        - "3"
      default: 0
    validations:
      required: true

  - type: textarea
    id: tweets
    attributes:
      label: ツイート
      description: ツイートのURLまたはID。改行または空白区切りで複数指定できます。
      placeholder: https://x.com/example/status/1234567890123456789
    validations:
      required: true
