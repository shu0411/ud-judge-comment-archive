name: Claude Agent - Respond to Mention

# Pull Requestのコメント・レビューで `@claude` とメンションされたら、Claude Codeが応答する。
# Claudeへの共通ルールは共通Action側にあるため、
# このファイルにはトリガーの判定と実行環境の準備だけを書く。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  respond:
    # Pull Request 上の `@claude` を含むコメント・レビューだけを対象にする
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ud-judge-comment-archive/package-lock.json

      - name: Install dependencies
        working-directory: ud-judge-comment-archive
        run: npm ci

      # Claudeが `npm run test:e2e` を実行できるよう、ブラウザを用意する
      - name: Install Playwright browser
        working-directory: ud-judge-comment-archive
        run: npx playwright install --with-deps chromium

      - uses: shu0411/.github/actions/respond-mention@main
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # npmコマンドは ud-judge-comment-archive/ で実行するため、cdも許可する
          additional-allowed-tools: "Bash(cd:*),Bash(npm:*),Bash(npx:*)"
          # このリポジトリ固有の追加指示があれば書く
          # extra-prompt: ""
